server_name: nats

port: 4222
http: 8222

# Logging configuration for centralized Loki pipeline
logtime: true
log_file: "/data/nats.log"

jetstream {

  # JetStream should have its own dedicated subdirectory, not root of /data
  store_dir: "/data/jetstream"
  max_mem_store: 1GB     # Optional: Cap in-memory JetStream limits
  max_file_store: 10GB   # Optional: Cap on-disk JetStream storage
}

# System Account configuration (Resolves the 503 / system privileges errors)
system_account: SYS

accounts {
  SYS: {
    users: [
      { user: "sys_admin", password: "sys_admin_pwd!" }
    ]
  }
  APP: {
    jetstream: enabled
    users: [
      { user: "app_user", password: "app_user_pwd!" }
    ]
  }
}