# ==============================================================================
# NATS Account & Authentication Configuration
# Defines isolated System (SYS) and Platform (PLATFORM) accounts
# ==============================================================================

system_account: SYS

accounts {

  # ----------------------------------------------------------------------------
  # 1. SYS Account (System Operator - Default, Untweaked)
  # Standard NATS System Account for cluster monitoring, diagnostics, and pings.
  # ----------------------------------------------------------------------------
  SYS {
    users = [
      {
        user: "sys-admin"
        password: "sys-password"
      }
    ]
  }

  # ----------------------------------------------------------------------------
  # 2. payment-system Account (Application Tenant Boundary)
  # 1:1 mapping between Application/Domain and NATS Account.
  # Contains both the Platform User (Control Plane) and App User (Data Plane).
  # ----------------------------------------------------------------------------
  payment-system {
    jetstream: enabled
    users = [
      # Role A: Domain Platform User (JetStream Control Plane)
      {
        user: "platform-user"
        password: "platform-password"
        permissions: {
          publish: {
            allow: [
              "$JS.API.STREAM.>",
              "$JS.API.CONSUMER.>",
              "$JS.API.ACCOUNT.>",
              "$JS.API.INFO",
              "$JS.API.*.LEADER.STEPDOWN.>",
              "$JS.API.*.PEER.>",
              "$JS.API.META.>",
              "$JS.API.SERVER.>",
              "_INBOX.>",
              "orders.>",
              "payments.>",
              "delivery.>"
            ]
            deny: [
              "$JS.API.ACCOUNT.PURGE",
              "$JS.API.STREAM.MSG.DELETE.>",
              "*.secret.>"
            ]
          }
          subscribe: {
            allow: [
              "$JS.API.>",
              "_INBOX.>"
            ]
            deny: [
              "*.secret.>"
            ]
          }
        }
      },

      # Role B: Application Service / Worker (Data Plane)
      {
        user: "app-user"
        password: "app-password"
        permissions: {
          publish: {
            allow: [
              "orders.>",
              "payments.>",
              "delivery.>",
              "$JS.API.CONSUMER.MSG.NEXT.>",
              "$JS.ACK.>",
              "$JS.API.STREAM.INFO.>",
              "$JS.API.CONSUMER.INFO.>",
              "$JS.API.STREAM.MSG.GET.>",
              "$JS.API.DIRECT.GET.>",
              "_INBOX.>"
            ]
            deny: [
              "$JS.API.STREAM.CREATE.>",
              "$JS.API.STREAM.UPDATE.>",
              "$JS.API.STREAM.DELETE.>",
              "$JS.API.STREAM.PURGE.>",
              "$JS.API.STREAM.MSG.DELETE.>",
              "$JS.API.CONSUMER.CREATE.>",
              "$JS.API.CONSUMER.DELETE.>",
              "$JS.API.CONSUMER.PAUSE.>",
              "$JS.API.ACCOUNT.PURGE",
              "*.secret.>"
            ]
          }
          subscribe: {
            allow: [
              "orders.>",
              "payments.>",
              "delivery.>",
              "notifications.>",
              "_INBOX.>"
            ]
            deny: [
              "*.secret.>"
            ]
          }
        }
      }
    ]
  }

}
