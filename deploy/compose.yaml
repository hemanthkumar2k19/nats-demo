services:

  # ============================================================================
  # HAProxy Load Balancer Ingress (Single Unified Gateway)
  # Exposes client ingress on :4222 and stats dashboard on :8404
  # ============================================================================

  haproxy:
    image: haproxy:alpine
    container_name: haproxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "4222:4222"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nats-1
      - nats-2
      - nats-3

  # ============================================================================
  # Unified NATS 3-Node Cluster
  # Auth is toggled dynamically via AUTH_FILE env variable
  # ============================================================================

  nats-1:
    image: nats:latest
    container_name: nats-1
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4223:4222"
      - "8222:8222"
    volumes:
      - ./nats-1.conf:/etc/nats/nats.conf:ro
      - ${AUTH_FILE:-./auth/empty.conf}:/etc/nats/users.conf:ro
      - ./data/nats-1:/data
    command: ["-c", "/etc/nats/nats.conf"]

  nats-2:
    image: nats:latest
    container_name: nats-2
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4224:4222"
      - "8223:8222"
    volumes:
      - ./nats-2.conf:/etc/nats/nats.conf:ro
      - ${AUTH_FILE:-./auth/empty.conf}:/etc/nats/users.conf:ro
      - ./data/nats-2:/data
    command: ["-c", "/etc/nats/nats.conf"]

  nats-3:
    image: nats:latest
    container_name: nats-3
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4225:4222"
      - "8224:8222"
    volumes:
      - ./nats-3.conf:/etc/nats/nats.conf:ro
      - ${AUTH_FILE:-./auth/empty.conf}:/etc/nats/users.conf:ro
      - ./data/nats-3:/data
    command: ["-c", "/etc/nats/nats.conf"]

  # ============================================================================
  # Observability Stack
  # Run via: docker compose --profile observability up -d
  # ============================================================================

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: nats-exporter
    profiles:
      - observability
    ports:
      - "7777:7777"
    command:
      - "-healthz"
      - "-varz"
      - "-jsz=all"
      - "http://nats-1:8222"
      - "http://nats-2:8222"
      - "http://nats-3:8222"
    depends_on:
      - nats-1
      - nats-2
      - nats-3

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    profiles:
      - observability
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/nats.yaml:ro
      - ./observability/stream-dashboard.json:/etc/grafana/provisioning/dashboards/nats/stream-dashboard.json:ro
      - ./observability/stream-dashboard.json:/otel-lgtm/grafana-dashboard-definitions/stream-dashboard.json:ro
      - ./observability/stream-dashboard.json:/otel-lgtm/grafana-dashboard-definitions/0/stream-dashboard.json:ro
      - ./observability/stream-dashboard.json:/grafana-dashboard-definitions/stream-dashboard.json:ro
    depends_on:
      - nats-exporter

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    profiles:
      - observability
    volumes:
      - ./data:/logs:ro
      - ./observability/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - otel-lgtm
