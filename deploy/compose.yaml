services:

  haproxy:
    image: haproxy:alpine
    container_name: haproxy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "4222:4222"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nats-1
      - nats-2
      - nats-3

  nats-1:
    image: nats:latest
    container_name: nats-1
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4223:4222"
      - "8222:8222"
    volumes:
      - ./nats-1.conf:/etc/nats/nats.conf:ro
      - ./data/nats-1:/data
    command: ["-c", "/etc/nats/nats.conf"]

  nats-2:
    image: nats:latest
    container_name: nats-2
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4224:4222"
      - "8223:8222"
    volumes:
      - ./nats-2.conf:/etc/nats/nats.conf:ro
      - ./data/nats-2:/data
    command: ["-c", "/etc/nats/nats.conf"]

  nats-3:
    image: nats:latest
    container_name: nats-3
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "4225:4222"
      - "8224:8222"
    volumes:
      - ./nats-3.conf:/etc/nats/nats.conf:ro
      - ./data/nats-3:/data
    command: ["-c", "/etc/nats/nats.conf"]
