global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    maxconn 4096
    timeout queue   10s
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend nats_in
    bind :4222
    mode tcp
    default_backend nats_cluster

backend nats_cluster
    mode tcp
    balance roundrobin
    server nats-1 nats-1:4222 check inter 2s fall 3 rise 2
    server nats-2 nats-2:4222 check inter 2s fall 3 rise 2
    server nats-3 nats-3:4222 check inter 2s fall 3 rise 2

frontend stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
