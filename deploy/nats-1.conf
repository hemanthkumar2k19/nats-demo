port: 4222
http_port: 8222

server_name: "nats-1"

# For Client Server Discovery through HAProxy Load Balancer
client_advertise: "127.0.0.1:4222"

# Connection and buffer safeguards
write_deadline: "5s"
max_pending: 32MB
max_payload: 8MB

jetstream {
    store_dir: "/data/jetstream"
    max_mem_store: 512MB
    max_file_store: 10GB
}

cluster {
    name: "local-nats-cluster"
    listen: "0.0.0.0:6222"

    routes [
        "nats://nats-2:6222"
        "nats://nats-3:6222"
    ]
}
