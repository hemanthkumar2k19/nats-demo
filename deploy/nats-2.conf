port: 4222
http_port: 8222

server_name: "nats-2"

# For Client Server Discovery through HAProxy Load Balancer
client_advertise: "127.0.0.1:4222"

jetstream {
    store_dir: "/data/jetstream"
}

cluster {
    name: "local-nats-cluster"
    listen: "0.0.0.0:6222"

    routes [
        "nats://nats-1:6222"
        "nats://nats-3:6222"
    ]
}
