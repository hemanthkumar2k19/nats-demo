port: 4222
http_port: 8222

server_name: "nats-3"

# Logging configuration (required for FluentBit in Observability stack)
log_file: "/data/nats.log"
logtime: true

jetstream {
    store_dir: "/data/jetstream"
}

cluster {
    name: "local-nats-cluster"
    listen: "0.0.0.0:6222"

    no_advertise: true
    
    routes [
        "nats://nats-1:6222"
        "nats://nats-2:6222"
    ]
}

include "users.conf"
