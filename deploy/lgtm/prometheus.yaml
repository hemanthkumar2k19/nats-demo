global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["localhost:8889"]

  - job_name: "nats-exporter"
    static_configs:
      - targets: ["nats-exporter:7777"]
        labels:
          service: "nats-server"
