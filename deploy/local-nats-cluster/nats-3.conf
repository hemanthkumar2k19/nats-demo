port: 4222
http_port: 8222

server_name: "nats-3"

log_file: "/data/nats.log"
logtime: true

client_advertise: "127.0.0.1:4224"

jetstream {
    store_dir: "/data/jetstream"
}

cluster {
    name: "local-nats-cluster"
    listen: "0.0.0.0:6222"

    routes [
        "nats://nats-1:6222"
        "nats://nats-2:6222"
    ]
}