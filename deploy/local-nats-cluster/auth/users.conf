# ==============================================================================
# NATS Account & Authentication Configuration
# Defines isolated System (SYS) and Platform (PLATFORM) accounts
# ==============================================================================

system_account: SYS

accounts {

  # ----------------------------------------------------------------------------
  # 1. SYS Account (System Operator - Default, Untweaked)
  # Standard NATS System Account for cluster monitoring, diagnostics, and pings.
  # ----------------------------------------------------------------------------
  SYS {
    users = [
      {
        user: "sys-admin"
        password: "sys-password"
      }
    ]
  }

  # ----------------------------------------------------------------------------
  # 2. PLATFORM Account (Platform / SRE Administrator)
  # Governed JetStream resource management with operational guardrails.
  # ----------------------------------------------------------------------------
  PLATFORM {
    jetstream: enabled
    users = [
      {
        user: "platform-admin"
        password: "platform-password"
        permissions: {
          publish: {
            allow: [
              "$JS.API.STREAM.>",
              "$JS.API.CONSUMER.>",
              "$JS.API.ACCOUNT.>",
              "$JS.API.INFO",
              "$JS.API.*.LEADER.STEPDOWN.>",
              "$JS.API.*.PEER.>",
              "$JS.API.META.>",
              "_INBOX.>",
              "delivery.>"
            ]
            deny: [
              "$JS.API.ACCOUNT.PURGE",
              "$JS.API.STREAM.MSG.DELETE.>",
              "*.secret.>"
            ]
          }
          subscribe: {
            allow: [
              "$JS.API.>",
              "_INBOX.>"
            ]
            deny: [
              "*.secret.>"
            ]
          }
        }
      }
    ]
  }

}
