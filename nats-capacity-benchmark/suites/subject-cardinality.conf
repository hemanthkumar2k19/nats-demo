# Subject Cardinality & Taxonomy Scaling Suite
# Evaluates Core NATS sublist trie routing latency and RAM footprint across 1 to 10,000 subjects and wildcards.

SUITE_ID="subject-cardinality"
SUITE_TITLE="Subject Cardinality & Taxonomy Scaling"
SUITE_DESCRIPTION="Evaluates Core NATS sublist trie routing latency and RAM footprint across 1 to 10,000 subjects and wildcards"

TEST_CASES=(
  "TEST-SC-1|Core NATS 1 Subject Baseline|benchmark.conf|SCENARIO=pubsub SUBJECT=benchmark.core.test MULTISUBJECT=false THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-SC-100|Core NATS 100 Subjects|benchmark.conf|SCENARIO=pubsub SUBJECT=benchmark.core.test MULTISUBJECT=true MULTISUBJECT_MAX=100 MULTISUBJECT_RANDOM=true THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-SC-1K|Core NATS 1000 Subjects|benchmark.conf|SCENARIO=pubsub SUBJECT=benchmark.core.test MULTISUBJECT=true MULTISUBJECT_MAX=1000 MULTISUBJECT_RANDOM=true THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-SC-10K|Core NATS 10000 Subjects|benchmark.conf|SCENARIO=pubsub SUBJECT=benchmark.core.test MULTISUBJECT=true MULTISUBJECT_MAX=10000 MULTISUBJECT_RANDOM=true THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-SC-WILDCARD|Core NATS Wildcard Routing (1k subjects vs >)|benchmark.conf|SCENARIO=pubsub PUB_SUBJECT=benchmark.core.test SUB_SUBJECT=benchmark.core.test.> MULTISUBJECT=true MULTISUBJECT_MAX=1000 MULTISUBJECT_RANDOM=true THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
)

