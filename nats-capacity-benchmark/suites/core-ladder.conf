# Core NATS Throughput Saturation Ladder Suite
# Ascending offered load rates to identify Core NATS capacity boundaries and draw latency curves.

SUITE_ID="core-ladder"
SUITE_TITLE="Core NATS Throughput Saturation Ladder"
SUITE_DESCRIPTION="Measures Core NATS latency degradation across ascending offered load rates"

TEST_CASES=(
  "TEST-CL-1K|Core NATS 1k msgs/s Baseline|benchmark.conf|THROUGHPUT=1000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-CL-10K|Core NATS 10k msgs/s|benchmark.conf|THROUGHPUT=10000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-CL-25K|Core NATS 25k msgs/s|benchmark.conf|THROUGHPUT=25000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-CL-50K|Core NATS 50k msgs/s|benchmark.conf|THROUGHPUT=50000 PUBS=4 SUBS=4 DURATION=30"
  "TEST-CL-100K|Core NATS 100k msgs/s Saturation|benchmark.conf|THROUGHPUT=100000 PUBS=8 SUBS=8 DURATION=30"
)

