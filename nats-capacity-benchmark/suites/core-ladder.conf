# Core NATS Throughput Saturation Ladder Suite
# Ascending offered load rates to identify Core NATS capacity boundaries and draw latency curves.

SUITE_ID="core-ladder"
SUITE_TITLE="Core NATS Throughput Saturation Ladder"
SUITE_DESCRIPTION="Measures Core NATS latency degradation across ascending offered load rates"

TEST_CASES=(
  "TEST-CL-1K|Core NATS 1k msgs/s Baseline|config/core-nats.conf|TARGET_MSGS_PER_SEC=1000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-CL-10K|Core NATS 10k msgs/s|config/core-nats.conf|TARGET_MSGS_PER_SEC=10000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-CL-25K|Core NATS 25k msgs/s|config/core-nats.conf|TARGET_MSGS_PER_SEC=25000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-CL-50K|Core NATS 50k msgs/s|config/core-nats.conf|TARGET_MSGS_PER_SEC=50000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-CL-100K|Core NATS 100k msgs/s Saturation|config/core-nats.conf|TARGET_MSGS_PER_SEC=100000 PUBLISHER_CONCURRENCY=8 SUBSCRIBER_CONCURRENCY=8 TEST_DURATION_SECONDS=30"
)

