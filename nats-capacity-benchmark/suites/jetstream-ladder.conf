  "TEST-JL-2.5K|JetStream Sync File R=3 (2,500 msg/s)|config/jetstream.conf|TARGET_MSGS_PER_SEC=2500 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
  "TEST-JL-5K|JetStream Sync File R=3 (5,000 msg/s)|config/jetstream.conf|TARGET_MSGS_PER_SEC=5000 PUBLISHER_CONCURRENCY=8 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
