# JetStream File R=3 Saturation Ladder Suite
# Evaluates JetStream synchronous Raft consensus disk write capacity under escalating offered rates.

SUITE_ID="jetstream-ladder"
SUITE_TITLE="JetStream File R=3 Saturation Ladder"
SUITE_DESCRIPTION="Identifies the Raft consensus and disk fsync capacity boundary for synchronous JetStream File R=3"

TEST_CASES=(
  "TEST-JL-250|JetStream Sync File R=3 (250 msg/s)|config/jetstream.conf|TARGET_MSGS_PER_SEC=250 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
  "TEST-JL-500|JetStream Sync File R=3 (500 msg/s)|config/jetstream.conf|TARGET_MSGS_PER_SEC=500 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
