# JetStream Cost of Guarantees Benchmark Suite
# Compares the progression of guarantees from in-memory Core NATS to full Raft File R=3 persistence.

SUITE_ID="jetstream-guarantees"
SUITE_TITLE="JetStream Cost of Guarantees Suite"
SUITE_DESCRIPTION="Comparative evaluation of Core NATS vs JetStream Memory R=3 vs File R=1 vs File R=3"

TEST_CASES=(
  "TEST-G1-CORE|Core NATS In-Memory Baseline|config/core-nats.conf|TARGET_MSGS_PER_SEC=1000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
  "TEST-G2-JS-MEM-R3|JetStream Memory R=3 Replication|config/jetstream.conf|STORAGE_TYPE=memory REPLICATION_FACTOR=3 TARGET_MSGS_PER_SEC=1000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
  "TEST-G3-JS-FILE-R1|JetStream File R=1 Persistence|config/jetstream.conf|STORAGE_TYPE=file REPLICATION_FACTOR=1 TARGET_MSGS_PER_SEC=1000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
  "TEST-G4-JS-FILE-R3|JetStream File R=3 Full Consensus|config/jetstream.conf|STORAGE_TYPE=file REPLICATION_FACTOR=3 TARGET_MSGS_PER_SEC=1000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=2 TEST_DURATION_SECONDS=30"
)

