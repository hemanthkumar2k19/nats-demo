# JetStream Cost of Guarantees Benchmark Suite
# Compares the progression of guarantees from in-memory Core NATS to full Raft File R=3 persistence.

SUITE_ID="jetstream-guarantees"
SUITE_TITLE="JetStream Cost of Guarantees Suite"
SUITE_DESCRIPTION="Comparative evaluation of Core NATS vs JetStream Memory R=3 vs File R=1 vs File R=3"

TEST_CASES=(
  "TEST-G1-CORE|Core NATS In-Memory Baseline|benchmark.conf|SCENARIO=pubsub QUEUE=bench-queue THROUGHPUT=1000 PUBS=4 SUBS=2 DURATION=30"
  "TEST-G2-JS-MEM-R3|JetStream Memory R=3 Replication|benchmark.conf|SCENARIO=js-pub-sync STORAGE=memory REPLICAS=3 MAX_BYTES=256MB THROUGHPUT=1000 PUBS=4 SUBS=2 DURATION=30"
  "TEST-G3-JS-FILE-R1|JetStream File R=1 Persistence|benchmark.conf|SCENARIO=js-pub-sync STORAGE=file REPLICAS=1 THROUGHPUT=1000 PUBS=4 SUBS=2 DURATION=30"
  "TEST-G4-JS-FILE-R3|JetStream File R=3 Full Consensus|benchmark.conf|SCENARIO=js-pub-sync STORAGE=file REPLICAS=3 THROUGHPUT=1000 PUBS=4 SUBS=2 DURATION=30"
)

