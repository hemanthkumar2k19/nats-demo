# Payload Dimension Scaling Suite
# Measures the impact of message size on network throughput, buffering, and latency.

SUITE_ID="payload-scaling"
SUITE_TITLE="Payload Dimension Scaling Suite"
SUITE_DESCRIPTION="Evaluates throughput and latency across payload sizes from 128 B to 32 KiB"

TEST_CASES=(
  "TEST-PL-128B|Payload 128 Bytes|config/core-nats.conf|MESSAGE_SIZE=128 TARGET_MSGS_PER_SEC=10000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-PL-1KB|Payload 1 KiB (Standard)|config/core-nats.conf|MESSAGE_SIZE=1024 TARGET_MSGS_PER_SEC=10000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-PL-8KB|Payload 8 KiB|config/core-nats.conf|MESSAGE_SIZE=8192 TARGET_MSGS_PER_SEC=5000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
  "TEST-PL-32KB|Payload 32 KiB (Large)|config/core-nats.conf|MESSAGE_SIZE=32768 TARGET_MSGS_PER_SEC=2000 PUBLISHER_CONCURRENCY=4 SUBSCRIBER_CONCURRENCY=4 TEST_DURATION_SECONDS=30"
)

