# Environment configuration
# Connection, infrastructure metrics and output settings.
# This file is sourced by Bash; use shell-compatible KEY="value" assignments.

# NATS endpoint. Use the HAProxy endpoint when benchmarking through the load balancer.
NATS_URL="nats://127.0.0.1:4222"

# Infrastructure metrics backend: podman or none.
METRICS_BACKEND="podman"

# Podman container names for the NATS nodes.
# Ignored when METRICS_BACKEND="none".
NATS_CONTAINERS="nats-1 nats-2 nats-3"

# Metrics sampling and idle baseline.
METRICS_SAMPLE_INTERVAL=5
BASELINE_DURATION_SECONDS=15

# Results are written beneath the project directory unless an absolute path is supplied.
RESULTS_DIR="results"
