# JetStream Workload Configuration
# This file is sourced by Bash; use shell-compatible KEY="value" assignments.

MESSAGING_TYPE="JetStream"

# Test Scenario:
#   pubsub   - Concurrent JetStream publish and pull consume (default)
#   publish  - Publishers send to stream without active consumers
#   consume  - Consumers replay from pre-populated stream without active publishers
SCENARIO="pubsub"

# Stream Persistence & Placement Settings
STREAM_NAME="BENCH_STREAM"
STREAM_SUBJECT="benchmark.js.test"
SUBJECT="benchmark.js.test"
STORAGE_TYPE="file"               # file (disk storage) or memory (RAM-backed)
REPLICATION_FACTOR=3              # 1 (single node) or 3 (R=3 Raft cluster)
MAX_BYTES="5GB"                   # Stream max storage quota
RETENTION_POLICY="limits"         # limits, interest, or workqueue

# JetStream Publishing Settings
JS_PUB_MODE="sync"                # sync (wait for consensus ACK) or async (pipelined)

# JetStream Consumer Settings
CONSUMER_NAME="bench-consumer"
CONSUMER_ACK_POLICY="explicit"    # explicit acknowledgment
CONSUMER_BATCH_SIZE=500           # max buffered messages in client pull batch

# Prepopulation (for consume-only replay tests; 0 disables)
PREPOPULATE_COUNT=0

# Concurrency & Workload Limits
TARGET_MSGS_PER_SEC=10000
MESSAGE_SIZE=1024
PUBLISHER_CONCURRENCY=1
SUBSCRIBER_CONCURRENCY=1
TEST_DURATION_SECONDS=60

# Timeout & Grace Period Settings (Seconds)
PUBLISHER_GRACE_SECONDS=20
SUBSCRIBER_DRAIN_SECONDS=25
JS_SETUP_TIMEOUT_SECONDS=15
