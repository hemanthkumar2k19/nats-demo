# Core NATS benchmark configuration
# This file is sourced by Bash. Use shell-compatible KEY="value" assignments.

# NATS connection. Use the HAProxy endpoint if testing through the load balancer.
NATS_URL="nats://127.0.0.1:4222"

# Core NATS workload
SUBJECT="benchmark.core.test"
TARGET_MSGS_PER_SEC=1000
MESSAGE_SIZE=1024
PUBLISHER_CONCURRENCY=1
CONSUMER_CONCURRENCY=1
TEST_DURATION_SECONDS=60

# Metric collection
METRICS_BACKEND="podman"
METRICS_SAMPLE_INTERVAL=5
BASELINE_DURATION_SECONDS=15
NATS_CONTAINERS="nats-1 nats-2 nats-3"

# Output
RESULTS_DIR="results"